server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8084/eureka
spring:
  application:
    name: Congif-Defult
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Tusher66/SalonServerConfiguration
          clone-on-start: true